app = "lore-dashboard"
primary_region = "ewr"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # <- changed from "auto" → "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/"
    tls_skip_verify = false

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
