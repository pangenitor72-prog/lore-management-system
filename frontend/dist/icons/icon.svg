<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2420"/>
      <stop offset="100%" style="stop-color:#1a1612"/>
    </linearGradient>
    <linearGradient id="mantleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c47c"/>
      <stop offset="25%" style="stop-color:#d4a574"/>
      <stop offset="50%" style="stop-color:#c98b8b"/>
      <stop offset="75%" style="stop-color:#a08bc9"/>
      <stop offset="100%" style="stop-color:#8ba88b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#c98b8b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#mantleGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Stylized Raven silhouette -->
  <g transform="translate(256, 180)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="65" ry="50" fill="#352f2a"/>
    <!-- Head -->
    <circle cx="45" cy="-10" r="35" fill="#352f2a"/>
    <!-- Beak -->
    <path d="M75 -15 L110 -5 L75 5 Z" fill="url(#accent)"/>
    <!-- Wing -->
    <path d="M-30 20 Q-90 -20 -70 60 Q-30 80 10 50 Z" fill="#453d36"/>
    <!-- Eye -->
    <circle cx="55" cy="-15" r="8" fill="url(#mantleGrad)"/>
    <circle cx="57" cy="-17" r="3" fill="#1a1612"/>
    <!-- Tail feathers -->
    <path d="M-50 70 L-80 120 L-60 75 L-70 130 L-40 80 L-50 125 L-20 75 Z" fill="#352f2a"/>
  </g>

  <!-- MANTLE text -->
  <text x="256" y="400" font-family="Georgia, serif" font-size="64" font-weight="300" letter-spacing="12" fill="url(#mantleGrad)" text-anchor="middle">MANTLE</text>

  <!-- Decorative lines beside text -->
  <line x1="40" y1="385" x2="100" y2="385" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <line x1="412" y1="385" x2="472" y2="385" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Subtle sparkle -->
  <circle cx="420" cy="100" r="15" fill="url(#mantleGrad)" opacity="0.6"/>
  <path d="M420 88 L420 112 M408 100 L432 100" stroke="#1a1612" stroke-width="3" stroke-linecap="round"/>
</svg>
