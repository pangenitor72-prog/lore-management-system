<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2420"/>
      <stop offset="100%" style="stop-color:#1a1612"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#c98b8b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.5"/>
  <!-- Book/scroll shape -->
  <path d="M140 120 L372 120 C390 120 392 140 392 160 L392 380 C392 400 380 400 360 400 L152 400 C132 400 120 400 120 380 L120 160 C120 140 122 120 140 120 Z" fill="#352f2a" stroke="url(#accent)" stroke-width="3"/>
  <!-- Page lines -->
  <line x1="160" y1="180" x2="340" y2="180" stroke="#8a7d70" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="220" x2="320" y2="220" stroke="#8a7d70" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="260" x2="300" y2="260" stroke="#8a7d70" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="300" x2="280" y2="300" stroke="#8a7d70" stroke-width="3" stroke-linecap="round"/>
  <!-- Quill/pen -->
  <path d="M320 340 L380 280 C390 270 400 280 390 290 L340 360 C335 370 320 370 320 360 L320 340 Z" fill="url(#accent)"/>
  <!-- Sparkle/AI indicator -->
  <circle cx="380" cy="140" r="25" fill="url(#accent)" opacity="0.8"/>
  <path d="M380 120 L380 160 M360 140 L400 140" stroke="#1a1612" stroke-width="4" stroke-linecap="round"/>
  <!-- AIRPG text -->
  <text x="256" y="460" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="url(#accent)" text-anchor="middle">AIRPG</text>
</svg>
