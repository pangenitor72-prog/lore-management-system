<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- D20 icosahedron face -->
  <defs>
    <linearGradient id="d20grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c98b8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a5a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main triangular face -->
  <polygon points="50,8 92,85 8,85" fill="url(#d20grad)" stroke="#2a1f1f" stroke-width="3"/>

  <!-- Inner highlight lines to show 3D facets -->
  <line x1="50" y1="8" x2="50" y2="60" stroke="#2a1f1f" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="60" x2="8" y2="85" stroke="#2a1f1f" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="60" x2="92" y2="85" stroke="#2a1f1f" stroke-width="1.5" opacity="0.4"/>

  <!-- Number 20 -->
  <text x="50" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1a1612">20</text>
</svg>
