<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fractal Explorer | MANTLE</title>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #16161a;
            --accent-gold: #D4AF37;
            --accent-gold-dim: rgba(212, 175, 55, 0.6);
            --text-primary: #f0ede8;
            --text-secondary: #a8a29e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            cursor: crosshair;
        }

        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Loading overlay */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .loading.visible {
            opacity: 1;
        }

        /* Controls Panel */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
            min-width: 220px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transition: opacity 0.3s, transform 0.3s;
        }

        .controls.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .controls h3 {
            color: var(--accent-gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .control-section {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .control-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .control-section-title {
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .control-row label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .control-row input[type="range"] {
            width: 90px;
            accent-color: var(--accent-gold);
        }

        .control-row span {
            color: var(--text-primary);
            font-size: 11px;
            width: 40px;
            text-align: right;
            font-family: monospace;
        }

        .btn {
            width: 100%;
            padding: 8px 12px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--accent-gold), #C9A959);
            border: none;
            border-radius: 4px;
            color: var(--bg-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn.active {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .btn-row .btn {
            flex: 1;
        }

        /* Toggle button */
        .toggle-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(15, 15, 18, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            color: var(--accent-gold);
            font-size: 18px;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .toggle-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Info display */
        .info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text-secondary);
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            line-height: 1.6;
        }

        .info strong {
            color: var(--accent-gold);
        }

        /* Navigation links */
        .nav-links {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Color palette preview */
        .palette-preview {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .palette-swatch {
            flex: 1;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .palette-swatch:hover {
            transform: scaleY(1.2);
        }

        .palette-swatch.active {
            border-color: var(--text-primary);
        }

        /* Preset locations */
        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .preset-btn {
            padding: 6px 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        /* Fullscreen hides most UI */
        body.fullscreen .controls,
        body.fullscreen .toggle-controls,
        body.fullscreen .nav-links {
            display: none;
        }

        body.fullscreen .info {
            opacity: 0.3;
        }

        body.fullscreen .info:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="loading" id="loading">Rendering...</div>

    <div class="nav-links">
        <a href="/games/flow-field.html" class="back-link">✨ Flow Field</a>
        <a href="/games/liars-dice.html" class="back-link">🎲 Liar's Dice</a>
        <a href="/games/skull.html" class="back-link">💀 Skull</a>
        <a href="../dist/index.html" class="back-link">← MANTLE</a>
    </div>

    <div class="info" id="info">
        <div><strong>Zoom:</strong> <span id="zoomLevel">1.0x</span></div>
        <div><strong>Center:</strong> <span id="centerCoords">0, 0</span></div>
        <div><strong>Mode:</strong> <span id="modeDisplay">Mandelbrot</span></div>
    </div>

    <button class="toggle-controls hidden" id="toggleBtn">⚙</button>

    <div class="controls" id="controls">
        <h3>Fractal Explorer</h3>

        <div class="control-section">
            <div class="control-section-title">Fractal Type</div>
            <div class="btn-row">
                <button class="btn active" id="mandelbrotBtn">Mandelbrot</button>
                <button class="btn secondary" id="juliaBtn">Julia</button>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Rendering</div>
            <div class="control-row">
                <label>Iterations</label>
                <input type="range" id="iterations" min="50" max="1000" value="200" step="10">
                <span id="iterationsVal">200</span>
            </div>
            <div class="control-row">
                <label>Color Cycles</label>
                <input type="range" id="colorCycles" min="1" max="10" value="3" step="0.5">
                <span id="colorCyclesVal">3</span>
            </div>
            <div class="control-row">
                <label>Smoothing</label>
                <input type="range" id="smoothing" min="0" max="1" value="1" step="1">
                <span id="smoothingVal">On</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Color Palette</div>
            <div class="palette-preview" id="palettePreview"></div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Animation</div>
            <div class="control-row">
                <label>Color Shift</label>
                <input type="range" id="colorShift" min="0" max="100" value="0" step="5">
                <span id="colorShiftVal">Off</span>
            </div>
            <div class="control-row" id="juliaAnimRow" style="display: none;">
                <label>Julia Morph</label>
                <input type="range" id="juliaMorph" min="0" max="100" value="0" step="5">
                <span id="juliaMorphVal">Off</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Interesting Locations</div>
            <div class="presets" id="presets"></div>
        </div>

        <button class="btn" id="fullscreenBtn">Fullscreen (F)</button>
        <button class="btn secondary" id="resetBtn">Reset View (R)</button>
        <button class="btn secondary" id="saveBtn">Save Image (S)</button>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let imageData, pixels;

        // View state
        let view = {
            centerX: -0.5,
            centerY: 0,
            zoom: 1,
            maxIter: 200,
            colorCycles: 3,
            smoothing: true,
            colorShift: 0,
            colorShiftSpeed: 0,
            juliaMorph: 0,
            juliaMorphSpeed: 0
        };

        // Julia set parameters
        let julia = {
            enabled: false,
            cx: -0.7,
            cy: 0.27015
        };

        // Rendering state
        let needsRender = true;
        let isRendering = false;
        let renderStartTime = 0;

        // Interaction state
        let isDragging = false;
        let dragStartX, dragStartY;
        let dragStartCenterX, dragStartCenterY;

        // ============================================
        // COLOR PALETTES
        // ============================================
        const palettes = {
            obsidian: {
                name: 'Obsidian Gold',
                colors: [
                    [15, 15, 18],      // Deep black
                    [45, 35, 20],      // Dark brown
                    [120, 90, 30],     // Bronze
                    [212, 175, 55],    // Gold
                    [240, 220, 150],   // Bright gold
                    [255, 250, 220],   // White gold
                    [212, 175, 55],    // Gold
                    [80, 60, 20],      // Dark gold
                    [30, 25, 15],      // Near black
                ]
            },
            ember: {
                name: 'Ember',
                colors: [
                    [15, 10, 8],
                    [60, 20, 10],
                    [140, 40, 15],
                    [220, 80, 20],
                    [255, 140, 50],
                    [255, 220, 150],
                    [255, 180, 80],
                    [180, 60, 20],
                    [40, 15, 8],
                ]
            },
            arctic: {
                name: 'Arctic',
                colors: [
                    [8, 12, 20],
                    [20, 40, 80],
                    [40, 80, 140],
                    [80, 140, 200],
                    [140, 200, 255],
                    [220, 240, 255],
                    [160, 200, 240],
                    [60, 100, 160],
                    [20, 30, 50],
                ]
            },
            void: {
                name: 'Void',
                colors: [
                    [10, 5, 15],
                    [40, 20, 60],
                    [80, 40, 120],
                    [140, 60, 180],
                    [200, 100, 220],
                    [255, 180, 255],
                    [220, 120, 200],
                    [100, 50, 140],
                    [30, 15, 45],
                ]
            },
            forest: {
                name: 'Forest',
                colors: [
                    [5, 15, 10],
                    [15, 45, 30],
                    [30, 90, 60],
                    [60, 150, 100],
                    [100, 200, 150],
                    [180, 240, 200],
                    [120, 200, 160],
                    [50, 120, 80],
                    [15, 40, 25],
                ]
            },
            electric: {
                name: 'Electric',
                colors: [
                    [0, 0, 10],
                    [0, 20, 60],
                    [0, 60, 140],
                    [20, 120, 200],
                    [80, 180, 255],
                    [200, 240, 255],
                    [255, 255, 200],
                    [255, 200, 100],
                    [140, 80, 40],
                ]
            }
        };

        let currentPalette = 'obsidian';

        // ============================================
        // PRESET LOCATIONS
        // ============================================
        const presets = [
            { name: 'Overview', x: -0.5, y: 0, zoom: 1 },
            { name: 'Seahorse Valley', x: -0.743643887037151, y: 0.131825904205330, zoom: 1000 },
            { name: 'Elephant Valley', x: 0.281717921930775, y: 0.5771052841488505, zoom: 500 },
            { name: 'Triple Spiral', x: -0.088625, y: 0.654913, zoom: 100 },
            { name: 'Lightning', x: -1.256827152259138, y: -0.37962642612165, zoom: 2000 },
            { name: 'Starfish', x: -0.374004139, y: 0.659792175, zoom: 5000 },
            { name: 'Mini Mandelbrot', x: -1.7497591451303, y: 0.0000000037, zoom: 50000 },
            { name: 'Spiral Galaxy', x: -0.761574, y: -0.0847596, zoom: 800 },
        ];

        const juliaPresets = [
            { name: 'Classic', cx: -0.7, cy: 0.27015 },
            { name: 'Dendrite', cx: 0, cy: 1 },
            { name: 'Siegel Disk', cx: -0.391, cy: -0.587 },
            { name: 'Rabbit', cx: -0.123, cy: 0.745 },
            { name: 'San Marco', cx: -0.75, cy: 0 },
            { name: 'Spiral', cx: 0.285, cy: 0.01 },
            { name: 'Dragon', cx: -0.8, cy: 0.156 },
            { name: 'Galaxies', cx: -0.4, cy: 0.6 },
        ];

        // ============================================
        // FRACTAL COMPUTATION
        // ============================================
        function mandelbrot(x0, y0, maxIter) {
            let x = 0, y = 0;
            let x2 = 0, y2 = 0;
            let iter = 0;

            while (x2 + y2 <= 4 && iter < maxIter) {
                y = 2 * x * y + y0;
                x = x2 - y2 + x0;
                x2 = x * x;
                y2 = y * y;
                iter++;
            }

            if (iter === maxIter) return -1;

            // Smooth coloring
            if (view.smoothing) {
                const log_zn = Math.log(x2 + y2) / 2;
                const nu = Math.log(log_zn / Math.LN2) / Math.LN2;
                return iter + 1 - nu;
            }
            return iter;
        }

        function juliaSet(x0, y0, cx, cy, maxIter) {
            let x = x0, y = y0;
            let x2 = x * x, y2 = y * y;
            let iter = 0;

            while (x2 + y2 <= 4 && iter < maxIter) {
                y = 2 * x * y + cy;
                x = x2 - y2 + cx;
                x2 = x * x;
                y2 = y * y;
                iter++;
            }

            if (iter === maxIter) return -1;

            if (view.smoothing) {
                const log_zn = Math.log(x2 + y2) / 2;
                const nu = Math.log(log_zn / Math.LN2) / Math.LN2;
                return iter + 1 - nu;
            }
            return iter;
        }

        // ============================================
        // COLOR MAPPING
        // ============================================
        function getColor(iter, maxIter) {
            if (iter < 0) return [0, 0, 0]; // Inside set = black

            const palette = palettes[currentPalette].colors;
            const numColors = palette.length;

            // Apply color shift animation
            const shifted = iter + view.colorShift;

            // Map iteration to color with cycling
            const t = (shifted * view.colorCycles / maxIter) % 1;
            const idx = t * (numColors - 1);
            const i1 = Math.floor(idx) % numColors;
            const i2 = (i1 + 1) % numColors;
            const f = idx - Math.floor(idx);

            // Interpolate between colors
            const c1 = palette[i1];
            const c2 = palette[i2];

            return [
                Math.round(c1[0] + (c2[0] - c1[0]) * f),
                Math.round(c1[1] + (c2[1] - c1[1]) * f),
                Math.round(c1[2] + (c2[2] - c1[2]) * f)
            ];
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            if (isRendering) return;
            isRendering = true;
            renderStartTime = performance.now();
            document.getElementById('loading').classList.add('visible');

            const scale = 4 / (view.zoom * Math.min(width, height));
            const maxIter = view.maxIter;

            // Get Julia parameters (possibly animated)
            let jx = julia.cx;
            let jy = julia.cy;
            if (view.juliaMorphSpeed > 0) {
                const t = performance.now() * 0.0001 * view.juliaMorphSpeed;
                jx = julia.cx + Math.sin(t) * 0.1;
                jy = julia.cy + Math.cos(t * 1.3) * 0.1;
            }

            // Render in chunks for responsiveness
            let y = 0;
            const chunkSize = 20;

            function renderChunk() {
                const endY = Math.min(y + chunkSize, height);

                for (; y < endY; y++) {
                    for (let x = 0; x < width; x++) {
                        const real = view.centerX + (x - width / 2) * scale;
                        const imag = view.centerY + (y - height / 2) * scale;

                        let iter;
                        if (julia.enabled) {
                            iter = juliaSet(real, imag, jx, jy, maxIter);
                        } else {
                            iter = mandelbrot(real, imag, maxIter);
                        }

                        const [r, g, b] = getColor(iter, maxIter);
                        const idx = (y * width + x) * 4;
                        pixels[idx] = r;
                        pixels[idx + 1] = g;
                        pixels[idx + 2] = b;
                        pixels[idx + 3] = 255;
                    }
                }

                if (y < height) {
                    requestAnimationFrame(renderChunk);
                } else {
                    ctx.putImageData(imageData, 0, 0);
                    isRendering = false;
                    document.getElementById('loading').classList.remove('visible');
                    needsRender = false;
                }
            }

            renderChunk();
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            // Handle color shift animation
            if (view.colorShiftSpeed > 0) {
                view.colorShift += view.colorShiftSpeed * 0.5;
                needsRender = true;
            }

            // Handle Julia morph animation
            if (julia.enabled && view.juliaMorphSpeed > 0) {
                needsRender = true;
            }

            if (needsRender && !isRendering) {
                render();
            }

            requestAnimationFrame(animate);
        }

        // ============================================
        // INTERACTION
        // ============================================
        function screenToComplex(screenX, screenY) {
            const scale = 4 / (view.zoom * Math.min(width, height));
            return {
                x: view.centerX + (screenX - width / 2) * scale,
                y: view.centerY + (screenY - height / 2) * scale
            };
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Zoom toward mouse position
            const complex = screenToComplex(mouseX, mouseY);

            const zoomFactor = e.deltaY > 0 ? 0.8 : 1.25;
            view.zoom *= zoomFactor;

            // Adjust center to zoom toward mouse
            view.centerX = complex.x + (view.centerX - complex.x) / zoomFactor;
            view.centerY = complex.y + (view.centerY - complex.y) / zoomFactor;

            updateInfo();
            needsRender = true;
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragStartCenterX = view.centerX;
            dragStartCenterY = view.centerY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const scale = 4 / (view.zoom * Math.min(width, height));
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;

            view.centerX = dragStartCenterX - dx * scale;
            view.centerY = dragStartCenterY - dy * scale;

            updateInfo();
            needsRender = true;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        // Double-click to set Julia parameter
        canvas.addEventListener('dblclick', (e) => {
            if (!julia.enabled) {
                const complex = screenToComplex(e.clientX, e.clientY);
                julia.cx = complex.x;
                julia.cy = complex.y;
                julia.enabled = true;
                document.getElementById('juliaBtn').classList.add('active');
                document.getElementById('mandelbrotBtn').classList.remove('active');
                document.getElementById('modeDisplay').textContent = `Julia (${julia.cx.toFixed(3)}, ${julia.cy.toFixed(3)})`;
                document.getElementById('juliaAnimRow').style.display = 'flex';
                updatePresets();
                needsRender = true;
            }
        });

        // Touch support
        let lastTouchDist = 0;
        let lastTouchCenter = { x: 0, y: 0 };

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                dragStartCenterX = view.centerX;
                dragStartCenterY = view.centerY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                lastTouchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const scale = 4 / (view.zoom * Math.min(width, height));
                const dx = e.touches[0].clientX - dragStartX;
                const dy = e.touches[0].clientY - dragStartY;

                view.centerX = dragStartCenterX - dx * scale;
                view.centerY = dragStartCenterY - dy * scale;

                updateInfo();
                needsRender = true;
            } else if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (lastTouchDist > 0) {
                    const zoomFactor = dist / lastTouchDist;
                    const center = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };

                    const complex = screenToComplex(center.x, center.y);
                    view.zoom *= zoomFactor;
                    view.centerX = complex.x + (view.centerX - complex.x) / zoomFactor;
                    view.centerY = complex.y + (view.centerY - complex.y) / zoomFactor;

                    updateInfo();
                    needsRender = true;
                }

                lastTouchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            lastTouchDist = 0;
        });

        // ============================================
        // UI CONTROLS
        // ============================================
        function updateInfo() {
            document.getElementById('zoomLevel').textContent = view.zoom >= 1000000
                ? (view.zoom / 1000000).toFixed(1) + 'M×'
                : view.zoom >= 1000
                    ? (view.zoom / 1000).toFixed(1) + 'K×'
                    : view.zoom.toFixed(1) + '×';
            document.getElementById('centerCoords').textContent =
                `${view.centerX.toFixed(6)}, ${view.centerY.toFixed(6)}`;
        }

        function updatePresets() {
            const container = document.getElementById('presets');
            const list = julia.enabled ? juliaPresets : presets;
            container.innerHTML = list.map((p, i) =>
                `<button class="preset-btn" data-index="${i}">${p.name}</button>`
            ).join('');

            container.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const i = parseInt(btn.dataset.index);
                    if (julia.enabled) {
                        julia.cx = juliaPresets[i].cx;
                        julia.cy = juliaPresets[i].cy;
                        document.getElementById('modeDisplay').textContent =
                            `Julia (${julia.cx.toFixed(3)}, ${julia.cy.toFixed(3)})`;
                    } else {
                        view.centerX = presets[i].x;
                        view.centerY = presets[i].y;
                        view.zoom = presets[i].zoom;
                        updateInfo();
                    }
                    needsRender = true;
                });
            });
        }

        function initPalettePreview() {
            const container = document.getElementById('palettePreview');
            container.innerHTML = Object.entries(palettes).map(([key, p]) => {
                const gradient = p.colors.slice(0, 5).map((c, i) =>
                    `rgb(${c[0]},${c[1]},${c[2]}) ${i * 25}%`
                ).join(', ');
                return `<div class="palette-swatch ${key === currentPalette ? 'active' : ''}"
                            data-palette="${key}"
                            title="${p.name}"
                            style="background: linear-gradient(90deg, ${gradient})"></div>`;
            }).join('');

            container.querySelectorAll('.palette-swatch').forEach(swatch => {
                swatch.addEventListener('click', () => {
                    document.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    currentPalette = swatch.dataset.palette;
                    needsRender = true;
                });
            });
        }

        // Control event listeners
        document.getElementById('iterations').addEventListener('input', (e) => {
            view.maxIter = parseInt(e.target.value);
            document.getElementById('iterationsVal').textContent = view.maxIter;
            needsRender = true;
        });

        document.getElementById('colorCycles').addEventListener('input', (e) => {
            view.colorCycles = parseFloat(e.target.value);
            document.getElementById('colorCyclesVal').textContent = view.colorCycles.toFixed(1);
            needsRender = true;
        });

        document.getElementById('smoothing').addEventListener('input', (e) => {
            view.smoothing = e.target.value === '1';
            document.getElementById('smoothingVal').textContent = view.smoothing ? 'On' : 'Off';
            needsRender = true;
        });

        document.getElementById('colorShift').addEventListener('input', (e) => {
            view.colorShiftSpeed = parseInt(e.target.value);
            document.getElementById('colorShiftVal').textContent = view.colorShiftSpeed > 0 ? view.colorShiftSpeed : 'Off';
        });

        document.getElementById('juliaMorph').addEventListener('input', (e) => {
            view.juliaMorphSpeed = parseInt(e.target.value);
            document.getElementById('juliaMorphVal').textContent = view.juliaMorphSpeed > 0 ? view.juliaMorphSpeed : 'Off';
        });

        document.getElementById('mandelbrotBtn').addEventListener('click', () => {
            julia.enabled = false;
            document.getElementById('mandelbrotBtn').classList.add('active');
            document.getElementById('juliaBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = 'Mandelbrot';
            document.getElementById('juliaAnimRow').style.display = 'none';
            updatePresets();
            needsRender = true;
        });

        document.getElementById('juliaBtn').addEventListener('click', () => {
            julia.enabled = true;
            document.getElementById('juliaBtn').classList.add('active');
            document.getElementById('mandelbrotBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = `Julia (${julia.cx.toFixed(3)}, ${julia.cy.toFixed(3)})`;
            document.getElementById('juliaAnimRow').style.display = 'flex';
            updatePresets();
            needsRender = true;
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen');
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            view.centerX = -0.5;
            view.centerY = 0;
            view.zoom = 1;
            julia.enabled = false;
            document.getElementById('mandelbrotBtn').classList.add('active');
            document.getElementById('juliaBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = 'Mandelbrot';
            document.getElementById('juliaAnimRow').style.display = 'none';
            updateInfo();
            updatePresets();
            needsRender = true;
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `fractal-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Toggle controls
        const controls = document.getElementById('controls');
        const toggleBtn = document.getElementById('toggleBtn');

        let controlsTimeout;
        document.addEventListener('mousemove', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!controls.matches(':hover')) {
                    controls.classList.add('hidden');
                    toggleBtn.classList.remove('hidden');
                }
            }, 4000);
        });

        toggleBtn.addEventListener('click', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                document.getElementById('fullscreenBtn').click();
            }
            if (e.key === 'r' || e.key === 'R') {
                document.getElementById('resetBtn').click();
            }
            if (e.key === 's' || e.key === 'S') {
                document.getElementById('saveBtn').click();
            }
            if (e.key === 'j' || e.key === 'J') {
                document.getElementById('juliaBtn').click();
            }
            if (e.key === 'm' || e.key === 'M') {
                document.getElementById('mandelbrotBtn').click();
            }
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            imageData = ctx.createImageData(width, height);
            pixels = imageData.data;
            needsRender = true;
        }

        window.addEventListener('resize', resize);

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen');
            }
            setTimeout(resize, 100);
        });

        // Start
        resize();
        updateInfo();
        updatePresets();
        initPalettePreview();
        animate();
    </script>
</body>
</html>
