<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fractal Explorer | MANTLE</title>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --accent-gold: #D4AF37;
            --text-primary: #f0ede8;
            --text-secondary: #a8a29e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            cursor: crosshair;
        }

        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
            min-width: 240px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transition: opacity 0.3s, transform 0.3s;
        }

        .controls.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .controls h3 {
            color: var(--accent-gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .control-section {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .control-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .control-section-title {
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .control-row label {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .control-row input[type="range"] {
            width: 80px;
            accent-color: var(--accent-gold);
        }

        .control-row span {
            color: var(--text-primary);
            font-size: 10px;
            width: 35px;
            text-align: right;
            font-family: monospace;
        }

        .btn {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--accent-gold), #C9A959);
            border: none;
            border-radius: 4px;
            color: var(--bg-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn.active {
            background: var(--accent-gold);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .btn.trip {
            background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
            background-size: 300% 100%;
            animation: rainbow-btn 2s linear infinite;
            color: #000;
            font-weight: 700;
        }

        @keyframes rainbow-btn {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .btn-row .btn {
            flex: 1;
            padding: 8px;
        }

        .toggle-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(15, 15, 18, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            color: var(--accent-gold);
            font-size: 18px;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .toggle-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text-secondary);
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            line-height: 1.6;
        }

        .info strong {
            color: var(--accent-gold);
        }

        .nav-links {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        .palette-preview {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .palette-swatch {
            width: 28px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .palette-swatch:hover {
            transform: scale(1.1);
        }

        .palette-swatch.active {
            border-color: var(--text-primary);
        }

        body.fullscreen .controls,
        body.fullscreen .toggle-controls,
        body.fullscreen .nav-links {
            display: none;
        }

        body.fullscreen .info {
            opacity: 0.3;
        }

        body.fullscreen .info:hover {
            opacity: 1;
        }

        /* Trip mode indicator */
        .trip-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .trip-indicator.visible {
            opacity: 1;
            animation: pulse-trip 1s ease-out forwards;
        }

        @keyframes pulse-trip {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="trip-indicator" id="tripIndicator">🌀</div>

    <div class="nav-links">
        <a href="/games/flow-field.html" class="back-link">✨ Flow Field</a>
        <a href="/games/liars-dice.html" class="back-link">🎲 Liar's Dice</a>
        <a href="../dist/index.html" class="back-link">← MANTLE</a>
    </div>

    <div class="info" id="info">
        <div><strong>Zoom:</strong> <span id="zoomLevel">1.0x</span></div>
        <div><strong>Mode:</strong> <span id="modeDisplay">Mandelbrot</span></div>
        <div><strong>FPS:</strong> <span id="fpsDisplay">--</span></div>
    </div>

    <button class="toggle-controls hidden" id="toggleBtn">⚙</button>

    <div class="controls" id="controls">
        <h3>Fractal Explorer</h3>

        <div class="control-section">
            <button class="btn trip" id="tripBtn">🌀 TRIP MODE</button>
        </div>

        <div class="control-section">
            <div class="control-section-title">Motion</div>
            <div class="control-row">
                <label>Auto-Zoom</label>
                <input type="range" id="autoZoom" min="0" max="100" value="0" step="5">
                <span id="autoZoomVal">Off</span>
            </div>
            <div class="control-row">
                <label>Drift</label>
                <input type="range" id="drift" min="0" max="100" value="0" step="5">
                <span id="driftVal">Off</span>
            </div>
            <div class="control-row">
                <label>Rotation</label>
                <input type="range" id="rotation" min="0" max="100" value="0" step="5">
                <span id="rotationVal">Off</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Psychedelic</div>
            <div class="control-row">
                <label>Color Cycle</label>
                <input type="range" id="colorCycle" min="0" max="100" value="0" step="5">
                <span id="colorCycleVal">Off</span>
            </div>
            <div class="control-row">
                <label>Pulse</label>
                <input type="range" id="pulse" min="0" max="100" value="0" step="5">
                <span id="pulseVal">Off</span>
            </div>
            <div class="control-row">
                <label>Warp</label>
                <input type="range" id="warp" min="0" max="100" value="0" step="5">
                <span id="warpVal">Off</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Rendering</div>
            <div class="control-row">
                <label>Detail</label>
                <input type="range" id="iterations" min="50" max="500" value="150" step="25">
                <span id="iterationsVal">150</span>
            </div>
            <div class="control-row">
                <label>Color Bands</label>
                <input type="range" id="colorBands" min="1" max="20" value="5" step="1">
                <span id="colorBandsVal">5</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Palette</div>
            <div class="palette-preview" id="palettePreview"></div>
        </div>

        <div class="control-section">
            <div class="control-section-title">Type</div>
            <div class="btn-row">
                <button class="btn active" id="mandelbrotBtn">Mandelbrot</button>
                <button class="btn secondary" id="juliaBtn">Julia</button>
            </div>
        </div>

        <button class="btn secondary" id="resetBtn">Reset (R)</button>
        <button class="btn secondary" id="fullscreenBtn">Fullscreen (F)</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let imageData, pixels;

        // Timing
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;

        // View state
        let view = {
            centerX: -0.5,
            centerY: 0,
            zoom: 1,
            rotation: 0,
            maxIter: 150,
            colorBands: 5
        };

        // Animation state
        let anim = {
            autoZoom: 0,
            drift: 0,
            driftAngle: Math.random() * Math.PI * 2,
            rotation: 0,
            colorCycle: 0,
            colorOffset: 0,
            pulse: 0,
            pulsePhase: 0,
            warp: 0,
            warpPhase: 0
        };

        // Julia
        let julia = {
            enabled: false,
            cx: -0.7,
            cy: 0.27015,
            morphSpeed: 0,
            morphPhase: 0
        };

        // Interaction
        let isDragging = false;
        let dragStartX, dragStartY, dragStartCenterX, dragStartCenterY;

        // Trip mode
        let tripMode = false;

        // ============================================
        // COLOR PALETTES - More psychedelic options
        // ============================================
        const palettes = {
            gold: {
                name: 'Gold',
                colors: [[15,15,18],[45,35,20],[120,90,30],[212,175,55],[255,240,180],[212,175,55],[80,60,20]]
            },
            rainbow: {
                name: 'Rainbow',
                colors: [[255,0,0],[255,127,0],[255,255,0],[0,255,0],[0,255,255],[0,0,255],[139,0,255],[255,0,127]]
            },
            neon: {
                name: 'Neon',
                colors: [[0,0,0],[255,0,128],[0,255,255],[255,255,0],[255,0,255],[0,255,128],[255,128,0],[128,0,255]]
            },
            acid: {
                name: 'Acid',
                colors: [[0,20,0],[0,80,20],[0,200,50],[150,255,0],[255,255,100],[200,255,50],[50,180,30],[0,60,10]]
            },
            plasma: {
                name: 'Plasma',
                colors: [[10,0,20],[60,0,100],[150,0,180],[255,50,200],[255,150,255],[200,100,255],[100,0,150],[30,0,50]]
            },
            fire: {
                name: 'Fire',
                colors: [[0,0,0],[40,0,0],[100,20,0],[180,60,0],[255,120,0],[255,200,50],[255,255,150],[255,200,50]]
            },
            ocean: {
                name: 'Ocean',
                colors: [[0,5,20],[0,20,60],[0,60,120],[0,120,180],[50,180,220],[150,220,255],[200,240,255],[100,200,240]]
            },
            void: {
                name: 'Void',
                colors: [[5,0,10],[20,0,40],[50,0,80],[100,20,150],[180,80,220],[255,150,255],[200,100,200],[80,30,100]]
            }
        };

        let currentPalette = 'rainbow';

        // ============================================
        // FRACTAL COMPUTATION
        // ============================================
        function computeFractal(x0, y0, maxIter, warpAmount, warpPhase) {
            // Apply warp distortion
            if (warpAmount > 0) {
                const wx = Math.sin(y0 * 10 + warpPhase) * warpAmount * 0.1;
                const wy = Math.cos(x0 * 10 + warpPhase) * warpAmount * 0.1;
                x0 += wx;
                y0 += wy;
            }

            let x, y, x2, y2, iter = 0;

            if (julia.enabled) {
                // Julia set with morphing
                let jx = julia.cx, jy = julia.cy;
                if (julia.morphSpeed > 0) {
                    jx += Math.sin(julia.morphPhase) * 0.1;
                    jy += Math.cos(julia.morphPhase * 1.3) * 0.1;
                }
                x = x0; y = y0;
                x2 = x * x; y2 = y * y;
                while (x2 + y2 <= 4 && iter < maxIter) {
                    y = 2 * x * y + jy;
                    x = x2 - y2 + jx;
                    x2 = x * x; y2 = y * y;
                    iter++;
                }
            } else {
                // Mandelbrot
                x = 0; y = 0; x2 = 0; y2 = 0;
                while (x2 + y2 <= 4 && iter < maxIter) {
                    y = 2 * x * y + y0;
                    x = x2 - y2 + x0;
                    x2 = x * x; y2 = y * y;
                    iter++;
                }
            }

            if (iter === maxIter) return -1;

            // Smooth coloring
            const log_zn = Math.log(x2 + y2) / 2;
            const nu = Math.log(log_zn / Math.LN2) / Math.LN2;
            return iter + 1 - nu;
        }

        function getColor(iter, maxIter, colorOffset, pulseAmount) {
            if (iter < 0) return [0, 0, 0];

            const palette = palettes[currentPalette].colors;
            const numColors = palette.length;

            // Apply color offset (cycling) and pulse
            let t = ((iter + colorOffset) * view.colorBands / maxIter) % 1;

            // Pulse effect - modulate brightness
            const pulseMod = 1 + Math.sin(pulseAmount) * 0.3;

            const idx = t * (numColors - 1);
            const i1 = Math.floor(idx) % numColors;
            const i2 = (i1 + 1) % numColors;
            const f = idx - Math.floor(idx);

            const c1 = palette[i1];
            const c2 = palette[i2];

            return [
                Math.min(255, Math.round((c1[0] + (c2[0] - c1[0]) * f) * pulseMod)),
                Math.min(255, Math.round((c1[1] + (c2[1] - c1[1]) * f) * pulseMod)),
                Math.min(255, Math.round((c1[2] + (c2[2] - c1[2]) * f) * pulseMod))
            ];
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            const scale = 4 / (view.zoom * Math.min(width, height));
            const maxIter = view.maxIter;
            const cos_r = Math.cos(view.rotation);
            const sin_r = Math.sin(view.rotation);
            const warpAmount = anim.warp;
            const warpPhase = anim.warpPhase;
            const colorOffset = anim.colorOffset;
            const pulseAmount = anim.pulsePhase;

            const cx = width / 2;
            const cy = height / 2;

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    // Screen to complex with rotation
                    let dx = (px - cx) * scale;
                    let dy = (py - cy) * scale;

                    // Apply rotation
                    const rx = dx * cos_r - dy * sin_r;
                    const ry = dx * sin_r + dy * cos_r;

                    const real = view.centerX + rx;
                    const imag = view.centerY + ry;

                    const iter = computeFractal(real, imag, maxIter, warpAmount, warpPhase);
                    const [r, g, b] = getColor(iter, maxIter, colorOffset, pulseAmount);

                    const idx = (py * width + px) * 4;
                    pixels[idx] = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // FPS counter
            frameCount++;
            if (frameCount % 30 === 0) {
                fps = Math.round(1000 / dt);
                document.getElementById('fpsDisplay').textContent = fps;
            }

            // Update animations
            if (anim.autoZoom > 0) {
                view.zoom *= 1 + anim.autoZoom * 0.001;
                // Slowly drift toward interesting areas
                if (anim.drift > 0) {
                    const driftSpeed = anim.drift * 0.00001 / view.zoom;
                    view.centerX += Math.cos(anim.driftAngle) * driftSpeed;
                    view.centerY += Math.sin(anim.driftAngle) * driftSpeed;
                    anim.driftAngle += 0.001;
                }
            }

            if (anim.rotation > 0) {
                view.rotation += anim.rotation * 0.0005;
            }

            if (anim.colorCycle > 0) {
                anim.colorOffset += anim.colorCycle * 0.1;
            }

            if (anim.pulse > 0) {
                anim.pulsePhase += anim.pulse * 0.05;
            }

            if (anim.warp > 0) {
                anim.warpPhase += anim.warp * 0.02;
            }

            if (julia.morphSpeed > 0) {
                julia.morphPhase += julia.morphSpeed * 0.01;
            }

            // Update info
            updateInfo();

            // Render
            render();

            requestAnimationFrame(animate);
        }

        // ============================================
        // INTERACTION
        // ============================================
        function screenToComplex(screenX, screenY) {
            const scale = 4 / (view.zoom * Math.min(width, height));
            const cos_r = Math.cos(view.rotation);
            const sin_r = Math.sin(view.rotation);
            let dx = (screenX - width / 2) * scale;
            let dy = (screenY - height / 2) * scale;
            const rx = dx * cos_r - dy * sin_r;
            const ry = dx * sin_r + dy * cos_r;
            return {
                x: view.centerX + rx,
                y: view.centerY + ry
            };
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const complex = screenToComplex(e.clientX, e.clientY);
            const zoomFactor = e.deltaY > 0 ? 0.85 : 1.18;
            view.zoom *= zoomFactor;
            view.centerX = complex.x + (view.centerX - complex.x) / zoomFactor;
            view.centerY = complex.y + (view.centerY - complex.y) / zoomFactor;
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragStartCenterX = view.centerX;
            dragStartCenterY = view.centerY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const scale = 4 / (view.zoom * Math.min(width, height));
            const cos_r = Math.cos(view.rotation);
            const sin_r = Math.sin(view.rotation);
            let dx = (e.clientX - dragStartX) * scale;
            let dy = (e.clientY - dragStartY) * scale;
            const rx = dx * cos_r - dy * sin_r;
            const ry = dx * sin_r + dy * cos_r;
            view.centerX = dragStartCenterX - rx;
            view.centerY = dragStartCenterY - ry;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        canvas.addEventListener('dblclick', (e) => {
            const complex = screenToComplex(e.clientX, e.clientY);
            if (!julia.enabled) {
                julia.cx = complex.x;
                julia.cy = complex.y;
                julia.enabled = true;
                julia.morphSpeed = 20;
                document.getElementById('juliaBtn').classList.add('active');
                document.getElementById('mandelbrotBtn').classList.remove('active');
                document.getElementById('modeDisplay').textContent = 'Julia (morphing)';
            }
        });

        // Touch support
        let lastTouchDist = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                dragStartCenterX = view.centerX;
                dragStartCenterY = view.centerY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const scale = 4 / (view.zoom * Math.min(width, height));
                const dx = (e.touches[0].clientX - dragStartX) * scale;
                const dy = (e.touches[0].clientY - dragStartY) * scale;
                view.centerX = dragStartCenterX - dx;
                view.centerY = dragStartCenterY - dy;
            } else if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (lastTouchDist > 0) {
                    const center = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                    const complex = screenToComplex(center.x, center.y);
                    const zoomFactor = dist / lastTouchDist;
                    view.zoom *= zoomFactor;
                    view.centerX = complex.x + (view.centerX - complex.x) / zoomFactor;
                    view.centerY = complex.y + (view.centerY - complex.y) / zoomFactor;
                }
                lastTouchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            lastTouchDist = 0;
        });

        // ============================================
        // UI
        // ============================================
        function updateInfo() {
            const zoomStr = view.zoom >= 1e9 ? (view.zoom / 1e9).toFixed(1) + 'B×'
                : view.zoom >= 1e6 ? (view.zoom / 1e6).toFixed(1) + 'M×'
                : view.zoom >= 1e3 ? (view.zoom / 1e3).toFixed(1) + 'K×'
                : view.zoom.toFixed(1) + '×';
            document.getElementById('zoomLevel').textContent = zoomStr;
        }

        function initPalettePreview() {
            const container = document.getElementById('palettePreview');
            container.innerHTML = Object.entries(palettes).map(([key, p]) => {
                const gradient = p.colors.slice(0, 4).map((c, i) =>
                    `rgb(${c[0]},${c[1]},${c[2]}) ${i * 33}%`
                ).join(', ');
                return `<div class="palette-swatch ${key === currentPalette ? 'active' : ''}"
                            data-palette="${key}"
                            title="${p.name}"
                            style="background: linear-gradient(90deg, ${gradient})"></div>`;
            }).join('');

            container.querySelectorAll('.palette-swatch').forEach(swatch => {
                swatch.addEventListener('click', () => {
                    document.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    currentPalette = swatch.dataset.palette;
                });
            });
        }

        function setSlider(id, value) {
            const slider = document.getElementById(id);
            slider.value = value;
            slider.dispatchEvent(new Event('input'));
        }

        // Trip mode
        document.getElementById('tripBtn').addEventListener('click', () => {
            tripMode = !tripMode;
            const btn = document.getElementById('tripBtn');
            const indicator = document.getElementById('tripIndicator');

            if (tripMode) {
                btn.classList.add('active');
                indicator.classList.add('visible');
                setTimeout(() => indicator.classList.remove('visible'), 1000);

                // Enable all the psychedelic effects
                setSlider('autoZoom', 30);
                setSlider('drift', 50);
                setSlider('rotation', 20);
                setSlider('colorCycle', 60);
                setSlider('pulse', 40);
                setSlider('warp', 30);
                currentPalette = 'rainbow';
                document.querySelectorAll('.palette-swatch').forEach(s => {
                    s.classList.toggle('active', s.dataset.palette === 'rainbow');
                });
            } else {
                btn.classList.remove('active');
                setSlider('autoZoom', 0);
                setSlider('drift', 0);
                setSlider('rotation', 0);
                setSlider('colorCycle', 0);
                setSlider('pulse', 0);
                setSlider('warp', 0);
            }
        });

        // Slider controls
        function setupSlider(id, animKey, displayFn) {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                anim[animKey] = val;
                document.getElementById(id + 'Val').textContent = displayFn ? displayFn(val) : (val > 0 ? val : 'Off');
            });
        }

        setupSlider('autoZoom', 'autoZoom');
        setupSlider('drift', 'drift');
        setupSlider('rotation', 'rotation');
        setupSlider('colorCycle', 'colorCycle');
        setupSlider('pulse', 'pulse');
        setupSlider('warp', 'warp');

        document.getElementById('iterations').addEventListener('input', (e) => {
            view.maxIter = parseInt(e.target.value);
            document.getElementById('iterationsVal').textContent = view.maxIter;
        });

        document.getElementById('colorBands').addEventListener('input', (e) => {
            view.colorBands = parseInt(e.target.value);
            document.getElementById('colorBandsVal').textContent = view.colorBands;
        });

        document.getElementById('mandelbrotBtn').addEventListener('click', () => {
            julia.enabled = false;
            julia.morphSpeed = 0;
            document.getElementById('mandelbrotBtn').classList.add('active');
            document.getElementById('juliaBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = 'Mandelbrot';
        });

        document.getElementById('juliaBtn').addEventListener('click', () => {
            julia.enabled = true;
            julia.morphSpeed = 20;
            document.getElementById('juliaBtn').classList.add('active');
            document.getElementById('mandelbrotBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = 'Julia (morphing)';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            view.centerX = -0.5;
            view.centerY = 0;
            view.zoom = 1;
            view.rotation = 0;
            julia.enabled = false;
            julia.morphSpeed = 0;
            anim.driftAngle = Math.random() * Math.PI * 2;
            document.getElementById('mandelbrotBtn').classList.add('active');
            document.getElementById('juliaBtn').classList.remove('active');
            document.getElementById('modeDisplay').textContent = 'Mandelbrot';
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen');
            }
        });

        // Toggle controls
        const controls = document.getElementById('controls');
        const toggleBtn = document.getElementById('toggleBtn');
        let controlsTimeout;

        document.addEventListener('mousemove', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!controls.matches(':hover')) {
                    controls.classList.add('hidden');
                    toggleBtn.classList.remove('hidden');
                }
            }, 4000);
        });

        toggleBtn.addEventListener('click', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreenBtn').click();
            if (e.key === 'r' || e.key === 'R') document.getElementById('resetBtn').click();
            if (e.key === 't' || e.key === 'T') document.getElementById('tripBtn').click();
            if (e.key === ' ') { e.preventDefault(); document.getElementById('tripBtn').click(); }
            if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
        });

        // ============================================
        // INIT
        // ============================================
        function resize() {
            // Use lower resolution for better performance
            const scale = 0.5;
            width = Math.floor(window.innerWidth * scale);
            height = Math.floor(window.innerHeight * scale);
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.imageSmoothingEnabled = false;
            imageData = ctx.createImageData(width, height);
            pixels = imageData.data;
        }

        window.addEventListener('resize', resize);

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen');
            }
            setTimeout(resize, 100);
        });

        resize();
        initPalettePreview();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
