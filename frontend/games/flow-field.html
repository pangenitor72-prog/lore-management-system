<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flow Field | MANTLE</title>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #16161a;
            --accent-gold: #D4AF37;
            --accent-gold-dim: rgba(212, 175, 55, 0.6);
            --accent-rose: #C9A959;
            --text-primary: #f0ede8;
            --text-secondary: #a8a29e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            cursor: crosshair;
        }

        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Controls Panel */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 18, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
            min-width: 200px;
            transition: opacity 0.3s, transform 0.3s;
        }

        .controls.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .controls h3 {
            color: var(--accent-gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-row label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .control-row input[type="range"] {
            width: 100px;
            accent-color: var(--accent-gold);
        }

        .control-row span {
            color: var(--text-primary);
            font-size: 11px;
            width: 35px;
            text-align: right;
        }

        .btn {
            width: 100%;
            padding: 8px 12px;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-rose));
            border: none;
            border-radius: 4px;
            color: var(--bg-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Toggle button */
        .toggle-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(15, 15, 18, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            color: var(--accent-gold);
            font-size: 18px;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .toggle-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Info text */
        .info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 12px;
            opacity: 0.6;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .info.fade {
            opacity: 0;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.7;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Fullscreen hides UI */
        body.fullscreen .controls,
        body.fullscreen .toggle-controls,
        body.fullscreen .back-link,
        body.fullscreen .info {
            display: none;
        }

        /* Color scheme indicators */
        .color-schemes {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.active {
            border-color: var(--text-primary);
        }

        .color-dot.gold {
            background: linear-gradient(135deg, #D4AF37, #C9A959);
        }

        .color-dot.ember {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
        }

        .color-dot.arctic {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
        }

        .color-dot.void {
            background: linear-gradient(135deg, #6c5ce7, #fd79a8);
        }

        .color-dot.forest {
            background: linear-gradient(135deg, #00b894, #81ecec);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div style="position: fixed; top: 20px; left: 20px; z-index: 100; display: flex; gap: 15px; flex-wrap: wrap;">
        <a href="/games/liars-dice.html" class="back-link">🎲 Liar's Dice</a>
        <a href="/games/ravens-gambit.html" class="back-link">🃏 Raven's Gambit</a>
        <a href="/games/shut-the-box.html" class="back-link">📦 Shut the Box</a>
        <a href="/games/skull.html" class="back-link">💀 Skull</a>
        <a href="../dist/index.html" class="back-link">← MANTLE</a>
    </div>

    <div class="info" id="info">Click or drag to create disturbances</div>

    <button class="toggle-controls hidden" id="toggleBtn">⚙</button>

    <div class="controls" id="controls">
        <h3>Flow Field</h3>

        <div class="control-row">
            <label>Particles</label>
            <input type="range" id="particleCount" min="1000" max="10000" value="5000" step="500">
            <span id="particleCountVal">5000</span>
        </div>

        <div class="control-row">
            <label>Speed</label>
            <input type="range" id="speed" min="0.5" max="4" value="1.5" step="0.1">
            <span id="speedVal">1.5</span>
        </div>

        <div class="control-row">
            <label>Noise Scale</label>
            <input type="range" id="noiseScale" min="100" max="800" value="300" step="50">
            <span id="noiseScaleVal">300</span>
        </div>

        <div class="control-row">
            <label>Trail Length</label>
            <input type="range" id="trailLength" min="1" max="50" value="15" step="1">
            <span id="trailLengthVal">15</span>
        </div>

        <div class="control-row">
            <label>Evolution</label>
            <input type="range" id="evolution" min="0" max="100" value="20" step="5">
            <span id="evolutionVal">20</span>
        </div>

        <label style="color: var(--text-secondary); font-size: 12px; display: block; margin-top: 12px;">Color Scheme</label>
        <div class="color-schemes">
            <div class="color-dot gold active" data-scheme="gold" title="Obsidian Gold"></div>
            <div class="color-dot ember" data-scheme="ember" title="Ember"></div>
            <div class="color-dot arctic" data-scheme="arctic" title="Arctic"></div>
            <div class="color-dot void" data-scheme="void" title="Void"></div>
            <div class="color-dot forest" data-scheme="forest" title="Forest"></div>
        </div>

        <button class="btn" id="fullscreenBtn">Enter Fullscreen</button>
        <button class="btn secondary" id="resetBtn">Reset Field</button>
    </div>

    <script>
        // ============================================
        // PERLIN NOISE IMPLEMENTATION
        // ============================================
        class PerlinNoise {
            constructor() {
                this.permutation = [];
                for (let i = 0; i < 256; i++) {
                    this.permutation[i] = i;
                }
                // Shuffle
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.permutation[i], this.permutation[j]] = [this.permutation[j], this.permutation[i]];
                }
                // Duplicate for overflow
                this.permutation = [...this.permutation, ...this.permutation];
            }

            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }

            lerp(a, b, t) {
                return a + t * (b - a);
            }

            grad(hash, x, y) {
                const h = hash & 3;
                const u = h < 2 ? x : y;
                const v = h < 2 ? y : x;
                return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
            }

            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;

                x -= Math.floor(x);
                y -= Math.floor(y);

                const u = this.fade(x);
                const v = this.fade(y);

                const A = this.permutation[X] + Y;
                const B = this.permutation[X + 1] + Y;

                return this.lerp(
                    this.lerp(this.grad(this.permutation[A], x, y), this.grad(this.permutation[B], x - 1, y), u),
                    this.lerp(this.grad(this.permutation[A + 1], x, y - 1), this.grad(this.permutation[B + 1], x - 1, y - 1), u),
                    v
                );
            }
        }

        // ============================================
        // COLOR SCHEMES
        // ============================================
        const colorSchemes = {
            gold: {
                bg: '#0f0f12',
                particles: [
                    { r: 212, g: 175, b: 55 },   // Gold
                    { r: 201, g: 169, b: 89 },   // Pale gold
                    { r: 180, g: 140, b: 45 },   // Deep gold
                    { r: 240, g: 210, b: 120 },  // Bright gold
                ],
                glow: 'rgba(212, 175, 55, 0.15)'
            },
            ember: {
                bg: '#0f0f12',
                particles: [
                    { r: 255, g: 107, b: 53 },   // Orange
                    { r: 247, g: 147, b: 30 },   // Amber
                    { r: 255, g: 71, b: 87 },    // Red
                    { r: 255, g: 200, b: 87 },   // Yellow
                ],
                glow: 'rgba(255, 107, 53, 0.15)'
            },
            arctic: {
                bg: '#0a0a12',
                particles: [
                    { r: 116, g: 185, b: 255 },  // Blue
                    { r: 162, g: 155, b: 254 },  // Purple
                    { r: 129, g: 236, b: 236 },  // Cyan
                    { r: 200, g: 220, b: 255 },  // Ice
                ],
                glow: 'rgba(116, 185, 255, 0.15)'
            },
            void: {
                bg: '#0a0510',
                particles: [
                    { r: 108, g: 92, b: 231 },   // Purple
                    { r: 253, g: 121, b: 168 },  // Pink
                    { r: 162, g: 155, b: 254 },  // Lavender
                    { r: 255, g: 118, b: 117 },  // Coral
                ],
                glow: 'rgba(108, 92, 231, 0.15)'
            },
            forest: {
                bg: '#050f0a',
                particles: [
                    { r: 0, g: 184, b: 148 },    // Teal
                    { r: 129, g: 236, b: 236 },  // Cyan
                    { r: 85, g: 239, b: 196 },   // Mint
                    { r: 0, g: 206, b: 201 },    // Turquoise
                ],
                glow: 'rgba(0, 184, 148, 0.15)'
            }
        };

        // ============================================
        // MAIN APPLICATION
        // ============================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let perlin = new PerlinNoise();
        let particles = [];
        let disturbances = [];
        let time = 0;
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;

        // Settings
        let settings = {
            particleCount: 5000,
            speed: 1.5,
            noiseScale: 300,
            trailLength: 15,
            evolution: 20,
            colorScheme: 'gold'
        };

        // ============================================
        // PARTICLE CLASS
        // ============================================
        class Particle {
            constructor() {
                this.reset();
                this.colorIndex = Math.floor(Math.random() * 4);
                this.brightness = 0.3 + Math.random() * 0.7;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.prevX = this.x;
                this.prevY = this.y;
                this.life = 0;
                this.maxLife = 200 + Math.random() * 300;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                // Get flow angle from noise
                const nx = this.x / settings.noiseScale;
                const ny = this.y / settings.noiseScale;
                const nt = time * settings.evolution * 0.0001;

                let angle = perlin.noise(nx + nt, ny + nt) * Math.PI * 4;

                // Apply disturbances
                for (const dist of disturbances) {
                    const dx = this.x - dist.x;
                    const dy = this.y - dist.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < dist.radius) {
                        const influence = (1 - distance / dist.radius) * dist.strength;
                        const distAngle = Math.atan2(dy, dx);
                        angle += distAngle * influence * 2;
                    }
                }

                // Move particle
                const speed = settings.speed * (0.5 + this.brightness * 0.5);
                this.x += Math.cos(angle) * speed;
                this.y += Math.sin(angle) * speed;

                this.life++;

                // Wrap around edges
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Reset if too old
                if (this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                const scheme = colorSchemes[settings.colorScheme];
                const color = scheme.particles[this.colorIndex];
                const alpha = this.brightness * 0.4 * (1 - this.life / this.maxLife * 0.3);

                ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        // ============================================
        // DISTURBANCE CLASS
        // ============================================
        class Disturbance {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 150;
                this.strength = 1;
                this.decay = 0.98;
            }

            update() {
                this.strength *= this.decay;
                this.radius *= 0.995;
                return this.strength > 0.01;
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Reset with background
            const scheme = colorSchemes[settings.colorScheme];
            ctx.fillStyle = scheme.bg;
            ctx.fillRect(0, 0, width, height);
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function adjustParticleCount() {
            const diff = settings.particleCount - particles.length;
            if (diff > 0) {
                for (let i = 0; i < diff; i++) {
                    particles.push(new Particle());
                }
            } else if (diff < 0) {
                particles.splice(0, -diff);
            }
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            const scheme = colorSchemes[settings.colorScheme];

            // Fade effect for trails
            ctx.fillStyle = `rgba(${parseInt(scheme.bg.slice(1,3), 16)}, ${parseInt(scheme.bg.slice(3,5), 16)}, ${parseInt(scheme.bg.slice(5,7), 16)}, ${1 / settings.trailLength})`;
            ctx.fillRect(0, 0, width, height);

            // Update and draw particles
            for (const particle of particles) {
                particle.update();
                particle.draw();
            }

            // Update disturbances
            disturbances = disturbances.filter(d => d.update());

            // Add continuous disturbance while mouse is down
            if (mouseDown) {
                disturbances.push(new Disturbance(mouseX, mouseY));
            }

            time++;
            requestAnimationFrame(animate);
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
            disturbances.push(new Disturbance(mouseX, mouseY));
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseDown = false;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            disturbances.push(new Disturbance(mouseX, mouseY));
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        });

        canvas.addEventListener('touchend', () => {
            mouseDown = false;
        });

        // ============================================
        // CONTROLS
        // ============================================
        const controls = document.getElementById('controls');
        const toggleBtn = document.getElementById('toggleBtn');

        document.getElementById('particleCount').addEventListener('input', (e) => {
            settings.particleCount = parseInt(e.target.value);
            document.getElementById('particleCountVal').textContent = settings.particleCount;
            adjustParticleCount();
        });

        document.getElementById('speed').addEventListener('input', (e) => {
            settings.speed = parseFloat(e.target.value);
            document.getElementById('speedVal').textContent = settings.speed.toFixed(1);
        });

        document.getElementById('noiseScale').addEventListener('input', (e) => {
            settings.noiseScale = parseInt(e.target.value);
            document.getElementById('noiseScaleVal').textContent = settings.noiseScale;
        });

        document.getElementById('trailLength').addEventListener('input', (e) => {
            settings.trailLength = parseInt(e.target.value);
            document.getElementById('trailLengthVal').textContent = settings.trailLength;
        });

        document.getElementById('evolution').addEventListener('input', (e) => {
            settings.evolution = parseInt(e.target.value);
            document.getElementById('evolutionVal').textContent = settings.evolution;
        });

        // Color scheme selection
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                settings.colorScheme = dot.dataset.scheme;
            });
        });

        // Fullscreen
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen');
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen');
            }
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            perlin = new PerlinNoise();
            disturbances = [];
            initParticles();
            const scheme = colorSchemes[settings.colorScheme];
            ctx.fillStyle = scheme.bg;
            ctx.fillRect(0, 0, width, height);
        });

        // Toggle controls
        toggleBtn.addEventListener('click', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
        });

        // Hide controls on canvas click (optional, for cleaner experience)
        let controlsTimeout;
        document.addEventListener('mousemove', () => {
            controls.classList.remove('hidden');
            toggleBtn.classList.add('hidden');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!controls.matches(':hover')) {
                    controls.classList.add('hidden');
                    toggleBtn.classList.remove('hidden');
                }
            }, 3000);
        });

        // Fade info text
        setTimeout(() => {
            document.getElementById('info').classList.add('fade');
        }, 4000);

        // ============================================
        // START
        // ============================================
        resize();
        initParticles();
        animate();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                document.getElementById('fullscreenBtn').click();
            }
            if (e.key === 'r' || e.key === 'R') {
                document.getElementById('resetBtn').click();
            }
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
