app = "lore-management-system"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Health check MUST be an array
  [[http_service.checks]]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"
    tls_skip_verify = false

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

