app = "lore-management-system"

[[services]]
  internal_port = 9000
  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # MUST be an array, NOT an object
  [[services.http_checks]]
    interval = "10s"
  timeout = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    grace_period = "30s"
