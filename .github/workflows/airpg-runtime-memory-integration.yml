name: AIRPG Memory Integration Pressure Invariant (MP-1)

on:
  push:
    branches:
      - airpg-runtime-minimal
  pull_request:
    branches:
      - airpg-runtime-minimal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Enforce Memory Integration Pressure Invariant (MP-1)
        run: python -m src.airpg.runtime.memory_integration_sanity_check
