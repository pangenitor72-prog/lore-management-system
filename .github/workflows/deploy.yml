name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - airpg-runtime-minimal  # Current active branch
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group  # Ensure only one deployment at a time
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Generate version
        id: version
        run: |
          VERSION="v1.5.$(date +%Y%m%d-%H%M)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > data/deployed_version.txt
          
      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/deployed_version.txt
          git commit -m "Update deployed version to $VERSION" || echo "No version changes"
          
      - name: Push version update
        run: |
          git push || echo "Failed to push version update (non-fatal)"
          
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-arg CACHEBUST=${{ github.run_id }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
